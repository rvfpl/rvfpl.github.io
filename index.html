<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bobby Fantini | Website</title>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #141414;
            --text-color: #f0f0f0;
            --text-muted: #888888;
            --accent-pink: #ff5263;
            --border-color: #262626;
            --sidebar-width: 56px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Screen Reader Only utility for accessibility */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Top Header Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand-logo {
            text-decoration: none;
            color: var(--text-color);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Desktop Navigation Links */
        .desktop-nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover,
        .nav-link:focus-visible {
            color: var(--text-color);
            outline: 2px solid var(--accent-pink);
            outline-offset: 4px;
            border-radius: 2px;
        }

        .nav-buttons {
            display: flex;
            gap: 0.5rem;
            margin-left: 1rem;
        }

        .btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn:hover,
        .btn:focus-visible {
            background-color: #1f1f1f;
            border-color: #404040;
            outline: none;
        }

        /* Hamburger Toggle Button */
        .hamburger-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hamburger-btn:focus-visible {
            outline: 2px solid var(--accent-pink);
        }

        /* Mobile Layout & Vertical Icon Sidebar */
        .mobile-icon-sidebar {
            display: none;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background-color: var(--bg-color);
            border-left: 1px solid var(--border-color);
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        .sidebar-top-btn {
            height: 56px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-icon-link {
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            text-decoration: none;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s ease;
        }

        .sidebar-icon-link:hover,
        .sidebar-icon-link:focus-visible {
            background-color: #1f1f1f;
            outline: none;
        }

        .sidebar-icon-link.active {
            background-color: var(--accent-pink);
            color: #000;
        }

        /* Mobile Full Menu Drawer */
        .mobile-drawer {
            display: none;
            position: fixed;
            top: 60px;
            left: 0;
            right: var(--sidebar-width);
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem;
            flex-direction: column;
            gap: 1rem;
            z-index: 9;
        }

        .mobile-drawer.is-open {
            display: flex;
        }

        /* Main Content Layout */
        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 4px;
        }

        .card-pink {
            background-color: var(--accent-pink);
            color: #000;
        }

        .card-pink a {
            color: #000;
            font-weight: 600;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .desktop-nav {
                display: none;
            }

            .mobile-icon-sidebar {
                display: flex;
            }

            .main-container {
                margin-right: var(--sidebar-width);
            }

            .hero-title {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <a href="#" class="brand-logo">
            <div class="brand-title">newyork.dev</div>
            <div class="brand-subtitle">a Bobby Fantini project</div>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="desktop-nav" aria-label="Main Navigation">
            <a href="#devs" class="nav-link">&lt;/devs&gt;</a>
            <a href="#companies" class="nav-link">companies</a>
            <a href="#events" class="nav-link">events</a>
            <a href="#jobs" class="nav-link">jobs</a>
            <div class="nav-buttons">
                <a href="#sub" class="btn">sub</a>
                <a href="#post" class="btn">Post Job</a>
            </div>
        </nav>
    </header>

    <!-- Mobile Vertical Icon Sidebar -->
    <aside class="mobile-icon-sidebar" aria-label="Quick Navigation Sidebar">
        <div class="sidebar-top-btn">
            <button class="hamburger-btn" id="menuToggleBtn" aria-expanded="false" aria-controls="mobileDrawer" aria-label="Toggle Navigation Menu">
                <i data-lucide="menu" id="menuIcon"></i>
            </button>
        </div>

        <a href="#starred" class="sidebar-icon-link active" aria-label="Starred / Featured">
            <i data-lucide="star"></i>
        </a>
        <a href="#jobs" class="sidebar-icon-link" aria-label="Jobs">
            <i data-lucide="briefcase"></i>
        </a>
        <a href="#events" class="sidebar-icon-link" aria-label="Events">
            <i data-lucide="plus"></i>
        </a>
        <a href="#companies" class="sidebar-icon-link" aria-label="Companies">
            <i data-lucide="building-2"></i>
        </a>
        <a href="#devs" class="sidebar-icon-link" aria-label="Developers">
            <i data-lucide="code-2"></i>
        </a>
        <a href="#profile" class="sidebar-icon-link" aria-label="User Profile">
            <i data-lucide="user"></i>
        </a>
    </aside>

    <!-- Mobile Full Menu Drawer -->
    <div class="mobile-drawer" id="mobileDrawer" role="region" aria-label="Mobile Menu Drawer">
        <a href="#devs" class="nav-link">&lt;/devs&gt;</a>
        <a href="#companies" class="nav-link">companies</a>
        <a href="#events" class="nav-link">events</a>
        <a href="#jobs" class="nav-link">jobs</a>
        <div style="display:flex; gap:0.5rem; margin-top: 0.5rem;">
            <a href="#sub" class="btn">sub</a>
            <a href="#post" class="btn">Post Job</a>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="main-container">
        <h1 class="hero-title">New York</h1>
        <p class="hero-subtitle">now compiling...</p>
        
        <p>Discover <strong>&lt;/devs&gt;</strong>, <strong>companies</strong>, <strong>events</strong>. Browse on-site / hybrid <strong>jobs</strong>.</p>

        <div class="cards-grid">
            <div class="card card-pink">
                <h3>Become a Founding Partner</h3>
                <p>Invite-only.</p>
            </div>
            <div class="card">
                <h3>ONCILLAS</h3>
                <p><a href="https://notnewyork.com" style="color:var(--text-color);">oncillas.com &rarr;</a></p>
            </div>
        </div>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Hamburger Menu Toggle Functionality
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const mobileDrawer = document.getElementById('mobileDrawer');
        const menuIcon = document.getElementById('menuIcon');

        menuToggleBtn.addEventListener('click', () => {
            const isOpen = menuToggleBtn.getAttribute('aria-expanded') === 'true';
            
            menuToggleBtn.setAttribute('aria-expanded', !isOpen);
            mobileDrawer.classList.toggle('is-open');

            // Swap between 'menu' and 'x' icon
            if (!isOpen) {
                menuIcon.setAttribute('data-lucide', 'x');
            } else {
                menuIcon.setAttribute('data-lucide', 'menu');
            }
            lucide.createIcons();
        });
    </script>
</body>
</html>
